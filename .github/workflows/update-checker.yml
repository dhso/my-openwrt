name: Check LEDE updates

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Trigger a build even when LEDE has not changed
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 5'

permissions:
  contents: write

concurrency:
  group: lede-update-checker
  cancel-in-progress: true

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master

jobs:
  check:
    name: Compare upstream revision
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Trigger build when upstream changed
        env:
          FORCE_BUILD: ${{ inputs.force_build }}
          GH_TOKEN: ${{ github.token }}
        run: |
          upstream_commit="$(
            git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{ print $1 }'
          )"
          [[ "$upstream_commit" =~ ^[0-9a-f]{40}$ ]]

          latest_body="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.body' 2>/dev/null || true
          )"

          if [[ "$FORCE_BUILD" != 'true' ]] && \
             grep -Fq "LEDE_COMMIT=$upstream_commit" <<< "$latest_body"; then
            echo "LEDE $upstream_commit has already been released."
            exit 0
          fi

          jq -n --arg commit "$upstream_commit" \
            '{event_type:"source-code-update", client_payload:{source_commit:$commit}}' \
            | gh api --method POST \
                "repos/$GITHUB_REPOSITORY/dispatches" \
                --input -

          echo "Triggered build for LEDE $upstream_commit."
