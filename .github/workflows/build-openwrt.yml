name: Build LEDE x86_64

on:
  repository_dispatch:
    types: [source-code-update]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish an immutable GitHub Release
        required: true
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: lede-x86-64
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/coolsnowwolf/lede.git
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  HELLOWORLD_REPO: https://github.com/fw876/helloworld.git
  HELLOWORLD_REF: 31b180df838e456bb36036bb8791f569af0fd661
  OPENAPPFILTER_REPO: https://github.com/destan19/OpenAppFilter.git
  OPENAPPFILTER_REF: 7fcf9e87dc75f7c28c74e09504a4efa0a2db3c92
  # Free-space checks are stage-specific because downloads and the toolchain
  # are expected to consume space as the build progresses.
  MIN_FREE_SYSTEM_GIB: '5'
  MIN_FREE_BEFORE_DOWNLOAD_GIB: '14'
  MIN_FREE_BEFORE_TOOLCHAIN_GIB: '20'
  MIN_FREE_WITH_CACHED_TOOLCHAIN_GIB: '14'
  MIN_FREE_BEFORE_FIRMWARE_GIB: '14'
  MIN_FREE_BEFORE_PACKAGE_GIB: '4'
  MIN_FREE_BEFORE_HEAVY_PACKAGE_GIB: '14'
  MIN_FREE_BEFORE_RUST_GIB: '20'
  MIN_FREE_BEFORE_IMAGE_GIB: '4'
  # Bump to discard every cached host tool and toolchain, for example if a
  # restored cache ever produces an inconsistent build.
  TOOLCHAIN_CACHE_VERSION: v2
  CCACHE_MAXSIZE: 2G
  STAGED_BUILD_JOBS: '2'
  STAGED_BUILD_RUST_JOBS: '1'
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
      release_name: ${{ steps.prepare.outputs.release_name }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}

    steps:
      - name: Show runner configuration before cleanup
        run: |
          echo "CPU cores: $(nproc)"
          lscpu
          free -h
          lsblk
          df -hT
          swapon --show

      # Install to the root filesystem before maximize-build-space consumes
      # most of its free blocks. Keep space on root for RUNNER_TEMP: the cache
      # action creates its compressed archives there, outside the build volume.
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libnsl-dev \
            libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz \
            ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
            wget xmlto xxd xz-utils zlib1g-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Select reserves for the runner disk layout
        id: disk-reserves
        run: |
          root_reserve_mb=6144
          temp_reserve_mb=100
          # The action allocates a PV on /, then another on /mnt. Newer
          # runners may put both paths on the same filesystem: the second
          # allocation would consume the first reserve down to just 100 MiB.
          if [[ "$(stat -c %d /)" == "$(stat -c %d /mnt)" ]]; then
            echo '/ and /mnt share a filesystem; preserve 6 GiB after both allocations'
            root_reserve_mb=8192
            temp_reserve_mb=6144
          fi
          {
            echo "root_reserve_mb=$root_reserve_mb"
            echo "temp_reserve_mb=$temp_reserve_mb"
          } >> "$GITHUB_OUTPUT"

      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: ${{ steps.disk-reserves.outputs.root_reserve_mb }}
          temp-reserve-mb: ${{ steps.disk-reserves.outputs.temp_reserve_mb }}
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show disk layout after expansion
        run: |
          df -hT
          lsblk
          free -h
          swapon --show
          # Target 6 GiB; allow overhead, but fail before any build if the
          # action consumed the system reserve again. Caches use RUNNER_TEMP.
          system_free_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          if (( system_free_kib < MIN_FREE_SYSTEM_GIB * 1024 * 1024 )); then
            echo "::error::System filesystem must retain at least ${MIN_FREE_SYSTEM_GIB} GiB after expansion"
            exit 1
          fi
          # Public standard runners normally have 4 CPUs/16 GB. Check the
          # actual allocation and retain a conservative fallback for smaller VMs.
          memory_mib="$(awk '/^MemTotal:/ { print int($2 / 1024) }' /proc/meminfo)"
          rust_jobs=1
          if (( $(nproc) >= 2 && memory_mib >= 12288 )); then
            rust_jobs=2
          fi
          echo "RUST_BUILD_JOBS=$rust_jobs" >> "$GITHUB_ENV"
          echo "Rust parallel jobs: $rust_jobs; RAM: $memory_mib MiB"

      # Must run after maximize-build-space: it re-creates and mounts the
      # build volume, so anything checked out earlier would be hidden.
      - name: Checkout build configuration
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Put build and test temporary files on the build volume
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/.tmp" >> "$GITHUB_ENV"

      - name: Check staged build helpers
        run: python3 -B -m unittest discover -s tests

      - name: Fetch LEDE source
        id: source
        env:
          REQUESTED_COMMIT: ${{ github.event.client_payload.source_commit }}
        run: |
          mkdir openwrt
          git -C openwrt init --quiet
          git -C openwrt remote add origin "$REPO_URL"

          if [[ -n "$REQUESTED_COMMIT" ]]; then
            [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git -C openwrt fetch --depth=1 origin "$REQUESTED_COMMIT"
          else
            git -C openwrt fetch --depth=1 origin "refs/heads/$REPO_BRANCH"
          fi

          git -C openwrt checkout --quiet --detach FETCH_HEAD
          source_commit="$(git -C openwrt rev-parse HEAD)"
          echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Prepare feeds and configuration
        run: |
          cp "$CONFIG_FILE" "$OPENWRT_PATH/.config.seed"
          cd "$OPENWRT_PATH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          BUILD_VERSION="$(date +'%y.%m.%d')-${SOURCE_COMMIT:0:7}" \
            "$GITHUB_WORKSPACE/$DIY_P2_SH"
          cp .config.seed .config
          make defconfig
          # Resolve the full application set once. Include all its kernel
          # modules in the base image so later installs cannot change the ABI.
          python3 "$GITHUB_WORKSPACE/staged-build.py" promote-kmods --source "$OPENWRT_PATH"
          make defconfig
          "$GITHUB_WORKSPACE/verify-config.sh" .config.seed .config
          if grep -qE '^CONFIG_PACKAGE_kmod-.*=m$' .config; then
            echo '::error::A required kernel module was not included in the base firmware'
            exit 1
          fi
          # Apply limits at the actual Go/Rust recipe boundary before any
          # package (including Xray in the base image) is compiled.
          python3 "$GITHUB_WORKSPACE/staged-build.py" prepare-build --source "$OPENWRT_PATH"

          device_target="$(sed -n 's/^CONFIG_TARGET_BOARD="\([^"]*\)"/\1/p' .config)"
          device_subtarget="$(sed -n 's/^CONFIG_TARGET_SUBTARGET="\([^"]*\)"/\1/p' .config)"
          : "${device_target:?Unable to determine target board}"
          : "${device_subtarget:?Unable to determine target subtarget}"
          echo "DEVICE_TARGET=$device_target" >> "$GITHUB_ENV"
          echo "DEVICE_SUBTARGET=$device_subtarget" >> "$GITHUB_ENV"

          # Toolchain cache key. Include the source trees plus shared build
          # logic that can change generated host tools or compiler output. The
          # inputs go to a file first so a failing command aborts the step
          # instead of silently producing a weaker key.
          key_input="$RUNNER_TEMP/toolchain-key-input"
          {
            git rev-parse \
              HEAD:Config.in \
              HEAD:Makefile \
              HEAD:config \
              HEAD:include \
              HEAD:rules.mk \
              HEAD:scripts \
              HEAD:target/Config.in \
              HEAD:target/linux/generic \
              HEAD:target/linux/x86 \
              HEAD:toolchain \
              HEAD:tools
            # Keep all non-package settings, including disabled toolchain
            # options. A partial allowlist can omit an ABI/compiler switch.
            grep -E '^(CONFIG_|# CONFIG_.* is not set$)' .config \
              | grep -vE '^(# )?CONFIG_PACKAGE_'
            printf '%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            gcc -dumpfullversion
            getconf GNU_LIBC_VERSION
          } > "$key_input"
          echo "TOOLCHAIN_HASH=$(sha256sum "$key_input" | cut -c1-16)" >> "$GITHUB_ENV"

      - name: Restore download cache
        id: dl-cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.OPENWRT_PATH }}/dl
          # v2 snapshots may contain partially trimmed module directories.
          key: lede-dl-v3-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lede-dl-v3-${{ runner.os }}-

      - name: Restore C and Go build caches
        id: ccache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.OPENWRT_PATH }}/.ccache
            ${{ env.OPENWRT_PATH }}/tmp/go-build
          key: lede-build-cache-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVICE_TARGET }}-${{ env.TOOLCHAIN_HASH }}-${{ hashFiles('openwrt/.config') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            lede-build-cache-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVICE_TARGET }}-${{ env.TOOLCHAIN_HASH }}-${{ hashFiles('openwrt/.config') }}-
            lede-build-cache-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVICE_TARGET }}-${{ env.TOOLCHAIN_HASH }}-
            lede-build-cache-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVICE_TARGET }}-

      # Host tools and the toolchain are expensive to build. Restore only on
      # an exact key match, so a stage built from
      # different inputs is never mixed in. The matching save step runs right
      # after they are built, so a later package failure does not lose them.
      # The path list must stay identical in the restore and save steps.
      - name: Restore toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.OPENWRT_PATH }}/staging_dir/host
            ${{ env.OPENWRT_PATH }}/staging_dir/toolchain-*
            ${{ env.OPENWRT_PATH }}/build_dir/host
            ${{ env.OPENWRT_PATH }}/build_dir/toolchain-*
          key: lede-toolchain-${{ runner.os }}-${{ env.TOOLCHAIN_CACHE_VERSION }}-${{ env.DEVICE_TARGET }}-${{ env.TOOLCHAIN_HASH }}

      - name: Check disk space before downloads
        run: |
          volume_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $2 }')"
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_free_kib="$(( MIN_FREE_BEFORE_DOWNLOAD_GIB * 1024 * 1024 ))"
          echo "Workspace volume size:      $(( volume_kib / 1024 / 1024 )) GiB"
          echo "Available workspace space: $(( available_kib / 1024 / 1024 )) GiB"
          echo "Required free space:       ${MIN_FREE_BEFORE_DOWNLOAD_GIB} GiB"
          df -hT "$GITHUB_WORKSPACE"
          du -sh "$OPENWRT_PATH"/dl "$OPENWRT_PATH"/.ccache 2>/dev/null || true
          if (( available_kib < required_free_kib )); then
            echo "::error::Insufficient disk space before downloads; at least ${MIN_FREE_BEFORE_DOWNLOAD_GIB} GiB must be free"
            exit 1
          fi

      - name: Download sources
        run: |
          cd "$OPENWRT_PATH"
          # package-m= changes the build schedule, not .config. Optional
          # applications and their sources are handled after the firmware.
          make download -j"$(nproc)" package-m=

      - name: Check disk space before toolchain compilation
        env:
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
        run: |
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_gib="$MIN_FREE_BEFORE_TOOLCHAIN_GIB"
          if [[ "${TOOLCHAIN_CACHE_HIT:-false}" == 'true' ]]; then
            required_gib="$MIN_FREE_WITH_CACHED_TOOLCHAIN_GIB"
          fi
          required_kib="$(( required_gib * 1024 * 1024 ))"
          echo "Toolchain cache hit:       ${TOOLCHAIN_CACHE_HIT:-false}"
          echo "Available workspace space: $(( available_kib / 1024 / 1024 )) GiB"
          echo "Required free space:       ${required_gib} GiB"
          df -hT "$GITHUB_WORKSPACE"
          du -sh "$OPENWRT_PATH"/dl "$OPENWRT_PATH"/.ccache 2>/dev/null || true
          if (( available_kib < required_kib )); then
            echo "::error::Insufficient disk space before toolchain compilation; at least ${required_gib} GiB must be free"
            exit 1
          fi

      - name: Build host tools and toolchain
        env:
          TOOLCHAIN_CACHE_HIT: ${{ steps.toolchain-cache.outputs.cache-hit }}
        run: |
          cd "$OPENWRT_PATH"
          echo "Toolchain cache hit: ${TOOLCHAIN_CACHE_HIT:-false}"
          # Compiler payloads are not all installed yet. Keep this stage's
          # entries isolated with the strict toolchain identity.
          export CCACHE_NAMESPACE="tools-$TOOLCHAIN_HASH"
          jobs="$(( $(nproc) + 1 ))"
          # Fresh checkout timestamps can re-enter aggregate make targets;
          # the retained per-package stamps avoid most actual compilation.
          if ! make -j"$jobs" CCACHE_COMPILERCHECK=content tools/install toolchain/install; then
            available_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi . | awk 'NR == 2 { print $4 }')"
            if (( available_kib < 1048576 || available_inodes < 16384 )); then
              echo '::error::Disk space or inodes exhausted; skipping toolchain retry'
              exit 1
            fi
            make -j1 V=s CCACHE_COMPILERCHECK=content tools/install toolchain/install
          fi
          du -sh staging_dir/host staging_dir/toolchain-* \
            build_dir/host build_dir/toolchain-* 2>/dev/null || true

      - name: Save toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.OPENWRT_PATH }}/staging_dir/host
            ${{ env.OPENWRT_PATH }}/staging_dir/toolchain-*
            ${{ env.OPENWRT_PATH }}/build_dir/host
            ${{ env.OPENWRT_PATH }}/build_dir/toolchain-*
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Identify installed compilers for safe cross-build reuse
        run: |
          identity="$(python3 "$GITHUB_WORKSPACE/staged-build.py" compiler-cache-id --source "$OPENWRT_PATH")"
          [[ "$identity" =~ ^[0-9a-f]{64}$ ]]
          echo "CCACHE_NAMESPACE=firmware-$identity" >> "$GITHUB_ENV"
          echo "Installed compiler identity: $identity"

      - name: Check disk space before firmware compilation
        run: |
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib="$(( MIN_FREE_BEFORE_FIRMWARE_GIB * 1024 * 1024 ))"
          echo "Available workspace space: $(( available_kib / 1024 / 1024 )) GiB"
          echo "Required free space:       ${MIN_FREE_BEFORE_FIRMWARE_GIB} GiB"
          df -hT "$GITHUB_WORKSPACE"
          du -sh \
            "$OPENWRT_PATH"/dl \
            "$OPENWRT_PATH"/.ccache \
            "$OPENWRT_PATH"/build_dir \
            "$OPENWRT_PATH"/staging_dir 2>/dev/null || true
          if (( available_kib < required_kib )); then
            echo "::error::Insufficient disk space before firmware compilation; at least ${MIN_FREE_BEFORE_FIRMWARE_GIB} GiB must be free"
            exit 1
          fi

      - name: Compile base firmware without optional applications
        run: |
          cd "$OPENWRT_PATH"
          jobs="$(( $(nproc) + 1 ))"
          if ! make -j"$jobs" CCACHE_COMPILERCHECK=content package-m=; then
            available_kib="$(df -Pk . | awk 'NR == 2 { print $4 }')"
            available_inodes="$(df -Pi . | awk 'NR == 2 { print $4 }')"
            if (( available_kib < 1048576 || available_inodes < 16384 )); then
              echo '::error::Disk space or inodes exhausted; skipping firmware retry'
              exit 1
            fi
            STAGED_BUILD_JOBS=1 make -j1 V=s CCACHE_COMPILERCHECK=content package-m=
          fi

      - name: Save base firmware configuration
        id: base
        run: |
          firmware_path="$OPENWRT_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"
          test -d "$firmware_path"
          cp "$OPENWRT_PATH/.config" "$OPENWRT_PATH/.config.firmware"
          cp "$OPENWRT_PATH/.config" "$firmware_path/build.config"
          cat > "$firmware_path/source.buildinfo" <<EOF
          BUILD_REPOSITORY=$GITHUB_REPOSITORY
          BUILD_COMMIT=$GITHUB_SHA
          LEDE_REPOSITORY=$REPO_URL
          LEDE_COMMIT=$SOURCE_COMMIT
          HELLOWORLD_REPOSITORY=$HELLOWORLD_REPO
          HELLOWORLD_COMMIT=$HELLOWORLD_REF
          OPENAPPFILTER_REPOSITORY=$OPENAPPFILTER_REPO
          OPENAPPFILTER_COMMIT=$OPENAPPFILTER_REF
          EOF
          python3 "$GITHUB_WORKSPACE/staged-build.py" verify-base \
            --source "$OPENWRT_PATH" \
            --requested-config "$OPENWRT_PATH/.config.seed" \
            --firmware-dir "$firmware_path"
          (
            cd "$firmware_path"
            find . -maxdepth 1 -type f ! -name sha256sums -print0 \
              | sort -z | xargs -0 sha256sum
          ) > "$firmware_path/sha256sums"
          echo "firmware_path=$firmware_path" >> "$GITHUB_OUTPUT"

      # Save the working firmware even if a later application fails to build.
      - name: Upload base firmware before compiling applications
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: firmware-base-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.base.outputs.firmware_path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Reclaim intermediate build space
        run: |
          python3 "$GITHUB_WORKSPACE/staged-build.py" cleanup \
            --source "$OPENWRT_PATH" \
            --firmware-dir "$OPENWRT_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"
          df -hT "$GITHUB_WORKSPACE"
          du -sh "$OPENWRT_PATH"/build_dir/* "$OPENWRT_PATH"/staging_dir/* 2>/dev/null || true

      - name: Compile optional application packages one source at a time
        run: |
          # Keep the same .config, toolchain and kernel. Each target builds
          # its dependencies; Shadowsocks Rust is last and uses the RAM-based limit.
          python3 "$GITHUB_WORKSPACE/staged-build.py" packages \
            --source "$OPENWRT_PATH" \
            --requested-config "$OPENWRT_PATH/.config.seed" \
            --jobs 2 \
            --rust-jobs "$RUST_BUILD_JOBS" \
            --min-free-gib "$MIN_FREE_BEFORE_PACKAGE_GIB" \
            --heavy-min-free-gib "$MIN_FREE_BEFORE_HEAVY_PACKAGE_GIB" \
            --rust-min-free-gib "$MIN_FREE_BEFORE_RUST_GIB"

      - name: Embed compiled applications and generate full firmware
        run: |
          # Install the existing local packages and regenerate only images.
          # A separate "full" prefix preserves the already uploaded base.
          python3 "$GITHUB_WORKSPACE/staged-build.py" image \
            --source "$OPENWRT_PATH" \
            --requested-config "$OPENWRT_PATH/.config.seed" \
            --firmware-dir "$OPENWRT_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET" \
            --image-min-free-gib "$MIN_FREE_BEFORE_IMAGE_GIB"

      - name: Prepare firmware artifact
        id: prepare
        run: |
          firmware_path="$OPENWRT_PATH/bin/targets/$DEVICE_TARGET/$DEVICE_SUBTARGET"
          : "${firmware_path:?Firmware path is empty}"
          test -d "$firmware_path"

          cp "$OPENWRT_PATH/.config" "$firmware_path/build.config"
          cp "$OPENWRT_PATH/build-timings.json" "$firmware_path/build-timings.json"

          package_paths=()
          if [[ -d "$OPENWRT_PATH/bin/packages" ]]; then
            package_paths+=(packages)
          fi
          if [[ -d "$firmware_path/packages" ]]; then
            package_paths+=("targets/$DEVICE_TARGET/$DEVICE_SUBTARGET/packages")
          fi
          if (( ${#package_paths[@]} > 0 )); then
            # Include target-specific packages as well as feed packages.
            # IPK/APK files are compressed already; move them into the archive
            # without retaining a second copy of every package.
            tar --remove-files -C "$OPENWRT_PATH/bin" \
              -cf "$firmware_path/packages.tar" "${package_paths[@]}"
          fi

          kernel_version="$(awk '$1 == "kernel" { print $3; exit }' "$firmware_path"/*.manifest)"
          file_date="$(date +'%Y.%m.%d')"
          release_tag="x86_64-${file_date}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          release_name="LEDE x86_64 ${file_date} #${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

          cat > "$firmware_path/RELEASE_NOTES.md" <<EOF
          基于 [coolsnowwolf/lede]($REPO_URL) 构建的 x86_64 固件。

          - 构建配置：\`$GITHUB_SHA\`
          - LEDE commit：\`$SOURCE_COMMIT\`
          - 内核版本：\`$kernel_version\`
          - 启动方式：Legacy BIOS / UEFI
          - 默认地址：\`192.168.1.1\`
          - 默认用户：\`root\`
          - 默认密码：空（首次登录后必须立即设置）
          - 推荐选择文件名带 \`-full-\` 的镜像：已内置 Docker、Shadowsocks Rust、Cloudflared 等全部已选应用
          - 不带 \`-full-\` 的基础版内置 SSR Plus、Xray 和 SSR 客户端，可按需手动安装其余应用
          - 第二阶段应用清单：\`deferred-packages.txt\`；完整镜像追加包清单：\`full-image-packages.txt\`
          - 独立安装包及依赖仍保留在 \`packages.tar\`，请与同次构建的固件配套使用

          <!-- LEDE_COMMIT=$SOURCE_COMMIT -->
          EOF

          (
            cd "$firmware_path"
            # RELEASE_NOTES.md is not uploaded as a release asset, so it must
            # not be listed or `sha256sum -c` fails for every downloader.
            find . -maxdepth 1 -type f \
              ! -name sha256sums ! -name RELEASE_NOTES.md -print0 \
              | sort -z \
              | xargs -0 sha256sum
          ) > "$firmware_path/sha256sums"

          artifact_name="firmware-$release_tag"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "firmware_path=$firmware_path" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.firmware_path }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      # No make invocation follows these steps, even on a failed build. Trim
      # only now so source cleanup cannot force downloads during compilation.
      # Separate restore/save actions refresh caches on reruns of the same SHA.
      - name: Bound download cache after all compilation
        id: trim-cache
        if: ${{ !cancelled() && steps.dl-cache.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/staged-build.py" trim-download-cache \
            --source "$OPENWRT_PATH" --download-cache-gib 2

      - name: Save download cache
        if: ${{ !cancelled() && steps.trim-cache.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ env.OPENWRT_PATH }}/dl
          key: ${{ steps.dl-cache.outputs.cache-primary-key }}

      - name: Bound C and Go build caches after all compilation
        id: trim-build-caches
        if: ${{ !cancelled() && steps.ccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 "$GITHUB_WORKSPACE/staged-build.py" trim-build-caches \
            --source "$OPENWRT_PATH" --go-cache-gib 1

      - name: Save C and Go build caches
        if: ${{ !cancelled() && steps.trim-build-caches.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ${{ env.OPENWRT_PATH }}/.ccache
            ${{ env.OPENWRT_PATH }}/tmp/go-build
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Show final resource usage
        if: always()
        run: |
          df -hT
          df -i
          free -h
          if [[ -n "${OPENWRT_PATH:-}" && -d "$OPENWRT_PATH" ]]; then
            du -sh \
              "$OPENWRT_PATH"/dl \
              "$OPENWRT_PATH"/.ccache \
              "$OPENWRT_PATH"/tmp/go-build \
              "$OPENWRT_PATH"/build_dir \
              "$OPENWRT_PATH"/staging_dir \
              "$OPENWRT_PATH"/bin 2>/dev/null || true
            du -sh "$OPENWRT_PATH"/build_dir/* 2>/dev/null || true
            if [[ -f "$OPENWRT_PATH/build-timings.json" ]]; then
              cat "$OPENWRT_PATH/build-timings.json"
            fi
            if [[ -x "$OPENWRT_PATH/staging_dir/host/bin/ccache" ]]; then
              CCACHE_DIR="$OPENWRT_PATH/.ccache" \
                "$OPENWRT_PATH/staging_dir/host/bin/ccache" --show-stats || true
            elif command -v ccache >/dev/null 2>&1; then
              CCACHE_DIR="$OPENWRT_PATH/.ccache" ccache --show-stats || true
            fi
          fi

  cache-maintenance:
    name: Retain bounded build-cache snapshots
    needs: build
    if: ${{ always() && !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout cache policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prune obsolete snapshots for this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cache-policy.py --max-gib 8

  release:
    name: Publish immutable release
    needs: build
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'repository_dispatch' || inputs.publish_release)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: firmware

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          notes_path="$PWD/firmware/RELEASE_NOTES.md"
          mapfile -d '' artifacts < <(
            find "$PWD/firmware" -maxdepth 1 -type f \
              ! -name RELEASE_NOTES.md -print0 | sort -z
          )
          (( ${#artifacts[@]} > 0 ))
          gh release create "$RELEASE_TAG" "${artifacts[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --notes-file "$notes_path" \
            --latest
